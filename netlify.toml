[build]
  command = "npm install --global pnpm@10.14.0 && pnpm install --no-frozen-lockfile && hugo --gc --minify --cleanDestinationDir -b $URL"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.162.0"
  GO_VERSION = "1.21.5"
  NODE_VERSION = "22"
  HUGO_ENABLEGITINFO = "true"
  PNPM_FLAGS = "--no-frozen-lockfile"

[context.production.environment]
  HUGO_ENV = "production"

[context.deploy-preview]
  command = "npm install --global pnpm@10.14.0 && pnpm install --no-frozen-lockfile && hugo --gc --minify --cleanDestinationDir --buildFuture -b $DEPLOY_PRIME_URL"

[context.branch-deploy]
  command = "npm install --global pnpm@10.14.0 && pnpm install --no-frozen-lockfile && hugo --gc --minify --cleanDestinationDir -b $DEPLOY_PRIME_URL"

[[headers]]
  for = "*.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=UTF-8"

[[headers]]
  for = "index.xml"
  [headers.values]
    Content-Type = "application/rss+xml"
